        <form method="POST" action="/register">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" placeholder="Votre nom..." value="<?= htmlspecialchars($_POST['nom'] ?? '') ?>">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="votre@email.com" value="<?= htmlspecialchars($_POST['email'] ?? '') ?>">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="8 caractères minimum..." oninput="validatePasswordStrength()">
                <div class="password-requirements">
                    <p><span class="req-item" id="req-length">○</span> Au moins 8 caractères</p>
                    <p><span class="req-item" id="req-uppercase">○</span> Une majuscule (A-Z)</p>
                    <p><span class="req-item" id="req-number">○</span> Un chiffre (0-9)</p>
                    <p><span class="req-item" id="req-symbol">○</span> Un symbole (!@#$%^&*...)</p>
                </div>

    </div>

<script>
function validatePasswordStrength() {
    const password = document.getElementById('password').value;

    // Vérifier chaque critère
    const hasLength = password.length >= 8;
    const hasUppercase = /[A-Z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    const hasSymbol = /[!@#$%^&*()_+\-=\[\]{};:\'",.<>?\/\\|`~]/.test(password);

    // Mettre à jour les indicateurs
    updateRequirement('req-length', hasLength);
    updateRequirement('req-uppercase', hasUppercase);
    updateRequirement('req-number', hasNumber);
    updateRequirement('req-symbol', hasSymbol);
}

function updateRequirement(elementId, isMet) {
    const element = document.getElementById(elementId);
    if (isMet) {
        element.textContent = '✓';
        element.className = 'req-item met';
    } else {
        element.textContent = '○';
        element.className = 'req-item';
    }
}
</script>

</body>
